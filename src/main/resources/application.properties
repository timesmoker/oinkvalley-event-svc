spring.application.name=event-svc

# SOT: 운영·k3s 값은 infra 폴더(Helm/매니페스트)가 단일 진실 소스. 이 파일은 Spring 바인딩 키만 정의한다.
server.port=${SERVER_PORT}

# HS256 검증용 공유 시크릿(발급 서비스와 동일). k3s: JWT_SECRET
jwt.secret=${JWT_SECRET}

# k3s·로컬 실행: SPRING_DATASOURCE_* 필수 (기본값 없음).
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.schema=${SPRING_DATASOURCE_HIKARI_SCHEMA}
spring.jpa.properties.hibernate.default_schema=${SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.open-in-view=false

# 쉼표 구분 태그 ID — 임시·정식 회원 캘린더 기본 노출 (infra env SOT)
calendar.default-visible-tag-ids=${CALENDAR_DEFAULT_VISIBLE_TAG_IDS:}

# POST /events/guest-bootstrap 시 오늘 전후 샘플 일정 1회 생성.
# enabled: GUEST_CALENDAR_BOOTSTRAP_ENABLED
# samples JSON: GUEST_CALENDAR_SAMPLES, subscribe JSON: GUEST_CALENDAR_SUBSCRIBE_TAGS (Helm guestCalendar.bootstrap SOT)
guest.calendar.bootstrap.enabled=${GUEST_CALENDAR_BOOTSTRAP_ENABLED:false}

# profile-svc (닉네임 등 — event-svc는 user_profiles 테이블을 직접 조회하지 않음)
service.user-profile.base-url=${SERVICE_USER_PROFILE_BASE_URL:http://profile-svc:8082}
